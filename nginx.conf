server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Compression for text-based assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA fallback: route unknown paths to the app shell
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health check for the CI/CD smoke test and uptime probes
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Hashed Vite assets are safe to cache aggressively
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Runtime env must always be revalidated
  location = /env.js {
    add_header Cache-Control "no-store" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
}
